name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        required: true
        default: 1.0.0

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        shell: powershell
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.0.2-x64.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe" -OutFile $installer
          $expectedHash = "5ad54ca3def786f8f4212552e54cc6d8d61329e2d24a1cfee0571d42c2684ff1"
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup checksum mismatch."
          }
          $process = Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }
      - name: Build and verify installer
        shell: powershell
        run: .\installer\windows\build-installer.ps1 -Version '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: OzonGMV-Setup-${{ inputs.version }}
          path: installer/windows/output/OzonGMV-Setup-${{ inputs.version }}.exe
          if-no-files-found: error
