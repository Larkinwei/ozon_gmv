name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        required: true
        default: 1.0.0

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Build and verify installer
        shell: powershell
        run: .\installer\windows\build-installer.ps1 -Version '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: OzonGMV-Setup-${{ inputs.version }}
          path: installer/windows/output/OzonGMV-Setup-${{ inputs.version }}.exe
          if-no-files-found: error
