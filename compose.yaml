services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 3001
      WALLBOARD_HOST: 0.0.0.0
      WALLBOARD_PORT: 3002
      PUBLIC_BASE_URL: https://${DOMAIN}
      OZON_API_BASE_URL: ${OZON_API_BASE_URL:-https://api-seller.ozon.ru}
      LOCAL_MODE: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - app-data:/data
    expose: ["3001", "3002"]
    networks: [internal]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: &default-logging
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

volumes:
  app-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
